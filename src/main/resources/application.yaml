server:
  port: 8080
  tomcat:
    max-part-count: 300
    max-swallow-size: -1

spring:
  application:
    name: conservation_backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/conservation}
    username: ${SPRING_DATASOURCE_USERNAME:conservation}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 1GB

conservation-guide-ai:
  base-url: ${CONSERVATION_GUIDE_AI_BASE_URL:http://localhost:8000}

pottery-inspection-ai:
  base-url: ${POTTERY_INSPECTION_AI_BASE_URL:http://localhost:8003}
  timeout-seconds: ${POTTERY_INSPECTION_AI_TIMEOUT_SECONDS:150}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  # Leave blank in EKS/EC2/ECS and use IAM role credentials.
  access-key-id: ${AWS_ACCESS_KEY_ID:}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  s3:
    bucket: ${AWS_S3_BUCKET:}
    # Local MinIO stand-in for S3 (see S3Config) - real AWS leaves these
    # blank and talks to the region default instead.
    endpoint: ${AWS_S3_ENDPOINT:}
    presign-endpoint: ${AWS_S3_PRESIGN_ENDPOINT:${AWS_S3_ENDPOINT:}}
    path-style-access-enabled: ${AWS_S3_PATH_STYLE_ACCESS_ENABLED:false}

xray:
  s3:
    presign-input-minutes: ${XRAY_PRESIGN_INPUT_MINUTES:30}
    presign-output-minutes: ${XRAY_PRESIGN_OUTPUT_MINUTES:120}
    presign-get-minutes: ${XRAY_PRESIGN_GET_MINUTES:120}
  ai:
    base-url: ${XRAY_AI_BASE_URL:http://localhost:8001}
    timeout-seconds: ${XRAY_AI_TIMEOUT_SECONDS:300}
    config-name: ${XRAY_AI_CONFIG_NAME:config.batch_fast.color_slot_voronoi_all_fragments_v13_conservative.json}
  stitch:
    callback-url: ${XRAY_STITCH_CALLBACK_URL:http://localhost:8080/api/xray/stitch/callback}
    callback-token: ${XRAY_STITCH_CALLBACK_TOKEN:}
    finalization-wait-seconds: ${XRAY_FINALIZATION_WAIT_SECONDS:300}

vca:
  access-token: ${VCA_ACCESS_TOKEN}
  # 기본 false면 SIGNED_PUT 경로를 사용한다. S3/object verifier가 없는
  # 로컬 in-memory 테스트에서만 VCA_LOCAL_DIRECT_COMPLETE_ENABLED=true로 켠다.
  local-direct-complete-enabled: ${VCA_LOCAL_DIRECT_COMPLETE_ENABLED:false}
  storage:
    local-root: ${VCA_SHARED_STORAGE_ROOT:./shared/vca}
    container-root: ${VCA_SHARED_STORAGE_CONTAINER_ROOT:${VCA_SHARED_STORAGE_ROOT:./shared/vca}}
    engine-output-root: ${VCA_ENGINE_OUTPUT_ROOT:./shared/vca/engine-output}
    document-corpus-root: ${VCA_DOCUMENT_CORPUS_ROOT:./shared/vca/document-corpus}
  s3:
    object-prefix: ${VCA_S3_OBJECT_PREFIX:vca/images}
  ai:
    base-url: ${VCA_AI_BASE_URL:http://localhost:8002}
    timeout-seconds: ${VCA_AI_TIMEOUT_SECONDS:150}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

logging:
  level:
    com.aivle.conservation_backend.xray_api: DEBUG
