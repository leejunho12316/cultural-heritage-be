services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: conservation
      POSTGRES_USER: conservation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conservation"]
      interval: 5s
      timeout: 5s
      retries: 5

  conservation-guide-ai:
    build: ./ai-services/conservation-guide-ai
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: postgresql://conservation:${POSTGRES_PASSWORD}@postgres:5432/conservation
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./ai-services/conservation-guide-ai/test_photos:/code/test_photos
      - ./ai-services/conservation-guide-ai/app/reinforcement_rag/reinforcement_docs:/code/app/reinforcement_rag/reinforcement_docs
      - ./ai-services/conservation-guide-ai/app/cleaning_rag/documents:/code/app/cleaning_rag/documents:ro
      - ./ai-services/conservation-guide-ai/app/cleaning_rag/index:/code/app/cleaning_rag/index
      - ./ai-services/conservation-guide-ai/app/bonding_rag/documents:/code/app/bonding_rag/documents:ro
      - ./ai-services/conservation-guide-ai/app/bonding_rag/index:/code/app/bonding_rag/index

  xray-ai:
    build: ./ai-services/xray-ai
    environment:
      XRAY_DEVICE: cpu
      XRAY_DEFAULT_CONF: "0.08"
      XRAY_NMS_IOU: "0.5"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      XRAY_STITCH_JOBS_ROOT: /tmp/xray_jobs
      XRAY_STITCH_CACHE_DIR: /tmp/xray_cache
      XRAY_STITCH_ENGINE_DIR: /code
      XRAY_STITCH_SINGLE_SCRIPT: /code/scripts/assemble_xray.py
      XRAY_STITCH_BATCH_SCRIPT: /code/scripts/batch_assemble.py
      XRAY_STITCH_CONFIG_DIR: /code/configs
      XRAY_STITCH_MAPPING_DIR: /code/mappings
      XRAY_STITCH_MAPPING_PATH: /code/mappings/mapping.color_front.json
      XRAY_CORS_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:3000
    ports:
      - "8001:8000"
    tmpfs:
      - /tmp/xray_jobs
      - /tmp/xray_cache
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3


  report-ai:
    build: ./ai-services/report-ai
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8002:8000"
    volumes:
      - ./ai-services/report-ai/app/documents:/code/app/documents:ro
      - ./ai-services/report-ai/app/index:/code/app/index
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  pottery-inspection-ai:
    build: ./ai-services/pottery-inspection-ai
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8003:8000"
    volumes:
      # ai_hub/pottery_multitask_model_v2(시대 CNN 모델)는 용량 때문에 git에
      # 포함되지 않을 수 있다. 폴더가 없으면 서비스는 기동되지만 시대 판정은
      # 비활성화되므로 팀 배포 전에 모델 파일을 별도로 확인한다.
      - ./ai-services/pottery-inspection-ai/ai_hub:/srv/ai_hub
      - pottery_hf_cache:/root/.cache/huggingface


  conservation-backend:
    build: .
    environment:
      CONSERVATION_GUIDE_AI_BASE_URL: http://conservation-guide-ai:8000
      POTTERY_INSPECTION_AI_BASE_URL: http://pottery-inspection-ai:8000
      REPORT_AI_BASE_URL: http://report-ai:8000
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      XRAY_AI_BASE_URL: http://xray-ai:8000
      XRAY_AI_TIMEOUT_SECONDS: "300"
      XRAY_AI_CONFIG_NAME: config.batch_fast.color_slot_voronoi_all_fragments_v13_conservative.json
      XRAY_STITCH_CALLBACK_URL: http://conservation-backend:8080/api/xray/stitch/callback
      XRAY_STITCH_CALLBACK_TOKEN: ${XRAY_STITCH_CALLBACK_TOKEN:-}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/conservation}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-conservation}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      conservation-guide-ai:
        condition: service_started
      xray-ai:
        condition: service_started
      pottery-inspection-ai:
        condition: service_started
      report-ai:
        condition: service_started
    ports:
      - "8080:8080"

volumes:
  pgdata:
  pottery_hf_cache:
