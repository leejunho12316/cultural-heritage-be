services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: conservation
      POSTGRES_USER: conservation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conservation"]
      interval: 5s
      timeout: 5s
      retries: 5

  conservation-guide-ai:
    build: ./ai-services/conservation-guide-ai
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: postgresql://conservation:${POSTGRES_PASSWORD}@postgres:5432/conservation
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./ai-services/conservation-guide-ai/test_photos:/code/test_photos

  # ------------------------------------------------------------
  # 추가 1 — X-ray 이상영역 탐지
  #
  # 호스트 포트는 8001을 쓴다.
  # 8000은 conservation-guide-ai가 사용 중이다.
  # 컨테이너 내부는 8000이므로 Spring에서는
  # http://xray-ai:8000 으로 접근한다.
  # ------------------------------------------------------------
  xray-ai:
    build: ./ai-services/xray-ai
    environment:
      XRAY_DEVICE: cpu
      XRAY_DEFAULT_CONF: "0.08"
      XRAY_NMS_IOU: "0.5"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # 추가 — 조각 결합
      #
      # 엔진·설정·매핑은 이미지 안에 복사되므로
      # 공유 볼륨이 필요 없다. AI 서비스는 상태를
      # 갖지 않고 요청 단위로 임시 폴더만 쓴다.
      XRAY_STITCH_ENGINE_DIR: /code/engine
      XRAY_STITCH_CONFIG_DIR: /code/configs
      XRAY_STITCH_MAPPING_DIR: /code/mappings
      XRAY_STITCH_CONFIG_NAME: v13_conservative
      XRAY_STITCH_TIMEOUT: "1800"
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  conservation-backend:
    build: .
    environment:
      CONSERVATION_GUIDE_AI_BASE_URL: http://conservation-guide-ai:8000
      # 추가 2 — Spring이 xray-ai를 찾는 주소
      XRAY_AI_BASE_URL: http://xray-ai:8000
    depends_on:
      - conservation-guide-ai
      # 추가 3
      - xray-ai
    ports:
      - "8080:8080"

volumes:
  pgdata: