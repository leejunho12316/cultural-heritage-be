services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: conservation
      POSTGRES_USER: conservation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conservation"]
      interval: 5s
      timeout: 5s
      retries: 5

  conservation-guide-ai:
    build: ./ai-services/conservation-guide-ai
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: postgresql://conservation:${POSTGRES_PASSWORD}@postgres:5432/conservation
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./ai-services/conservation-guide-ai/test_photos:/code/test_photos
      - ./ai-services/conservation-guide-ai/app/reinforcement_rag/reinforcement_docs:/code/app/reinforcement_rag/reinforcement_docs
      - ./ai-services/conservation-guide-ai/app/cleaning_rag/documents:/code/app/cleaning_rag/documents:ro
      - ./ai-services/conservation-guide-ai/app/cleaning_rag/index:/code/app/cleaning_rag/index
      - ./ai-services/conservation-guide-ai/app/bonding_rag/documents:/code/app/bonding_rag/documents:ro
      - ./ai-services/conservation-guide-ai/app/bonding_rag/index:/code/app/bonding_rag/index

  xray-ai:
    build: ./ai-services/xray-ai
    environment:
      XRAY_DEVICE: cpu
      XRAY_DEFAULT_CONF: "0.08"
      XRAY_NMS_IOU: "0.5"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      XRAY_STITCH_JOBS_ROOT: /shared/jobs
      XRAY_STITCH_ENGINE_DIR: /code
      XRAY_STITCH_SINGLE_SCRIPT: /code/scripts/assemble_xray.py
      XRAY_STITCH_BATCH_SCRIPT: /code/scripts/batch_assemble.py
      XRAY_STITCH_CONFIG_DIR: /code/configs
      XRAY_STITCH_MAPPING_DIR: /code/mappings
      XRAY_STITCH_MAPPING_PATH: /code/mappings/mapping.color_front.json
      XRAY_STITCH_CACHE_DIR: /shared/cache
    ports:
      - "8001:8000"
    volumes:
      - ./shared:/shared
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

  vca-ai:
    build: ./ai-services/vca-ai
    environment:
      VCA_SHARED_STORAGE_ROOT: /vca_v2/output/input
      VCA_ENGINE_ROOT: /vca_v2
      VCA_DRY_RUN_TIMEOUT_SECONDS: "120"
      UV_PROJECT_ENVIRONMENT: /opt/vca-uv-env
      UV_CACHE_DIR: /opt/vca-uv-cache
      UV_FROZEN: "true"
    volumes:
      - ./shared:/shared
      - ../vca_v2:/vca_v2:ro
      - ./shared/vca/engine-output:/vca_v2/output
      - ./shared/vca/input-store:/vca_v2/output/input
      - vca_uv_env:/opt/vca-uv-env
      - vca_uv_cache:/opt/vca-uv-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  conservation-backend:
    build: .
    environment:
      CONSERVATION_GUIDE_AI_BASE_URL: http://conservation-guide-ai:8000
      VCA_AI_BASE_URL: http://vca-ai:8000
      VCA_AI_TIMEOUT_SECONDS: "150"
      VCA_ACCESS_TOKEN: ${VCA_ACCESS_TOKEN:?VCA_ACCESS_TOKEN is required for /api/vca}
      VCA_SHARED_STORAGE_ROOT: /shared/vca/input-store
      VCA_SHARED_STORAGE_CONTAINER_ROOT: /vca_v2/output/input
      VCA_ENGINE_OUTPUT_ROOT: /shared/vca/engine-output
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      XRAY_AI_BASE_URL: http://xray-ai:8000
      XRAY_AI_TIMEOUT_SECONDS: "300"
      XRAY_AI_CONFIG_NAME: config.batch_fast.color_slot_voronoi_all_fragments_v13_conservative.json
      XRAY_STORAGE_LOCAL_ROOT: /shared/jobs
      XRAY_STORAGE_CONTAINER_ROOT: /shared/jobs
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/conservation
      SPRING_DATASOURCE_USERNAME: conservation
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      conservation-guide-ai:
        condition: service_started
      xray-ai:
        condition: service_started
      vca-ai:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - ./shared:/shared

volumes:
  pgdata:
  vca_uv_env:
  vca_uv_cache:
