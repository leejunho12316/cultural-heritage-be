# 계정ID: 428270342381, 리전: ap-northeast-2
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conservation-guide-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conservation-guide-ai
  template:
    metadata:
      labels:
        app: conservation-guide-ai
    spec:
      containers:
        - name: conservation-guide-ai
          image: 428270342381.dkr.ecr.ap-northeast-2.amazonaws.com/conservation-guide-ai:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: app-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: conservation-guide-ai
spec:
  selector:
    app: conservation-guide-ai
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xray-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xray-ai
  template:
    metadata:
      labels:
        app: xray-ai
    spec:
      containers:
        - name: xray-ai
          image: 428270342381.dkr.ecr.ap-northeast-2.amazonaws.com/xray-ai:latest
          ports:
            - containerPort: 8000
          env:
            - name: XRAY_DEVICE
              value: "cpu"
            - name: XRAY_DEFAULT_CONF
              value: "0.08"
            - name: XRAY_NMS_IOU
              value: "0.5"
            - name: XRAY_STITCH_JOBS_ROOT
              value: "/tmp/xray_jobs"
            - name: XRAY_STITCH_ENGINE_DIR
              value: "/code"
            - name: XRAY_STITCH_SINGLE_SCRIPT
              value: "/code/scripts/assemble_xray.py"
            - name: XRAY_STITCH_BATCH_SCRIPT
              value: "/code/scripts/batch_assemble.py"
            - name: XRAY_STITCH_CONFIG_DIR
              value: "/code/configs"
            - name: XRAY_STITCH_MAPPING_DIR
              value: "/code/mappings"
            - name: XRAY_STITCH_MAPPING_PATH
              value: "/code/mappings/mapping.color_front.json"
            - name: XRAY_STITCH_CACHE_DIR
              value: "/tmp/xray_cache"
          envFrom:
            - secretRef:
                name: app-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: xray-ai
spec:
  selector:
    app: xray-ai
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pottery-inspection-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pottery-inspection-ai
  template:
    metadata:
      labels:
        app: pottery-inspection-ai
    spec:
      containers:
        - name: pottery-inspection-ai
          image: 428270342381.dkr.ecr.ap-northeast-2.amazonaws.com/pottery-inspection-ai:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: app-secrets
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
      volumes:
        - name: hf-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pottery-inspection-ai
spec:
  selector:
    app: pottery-inspection-ai
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vca-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vca-ai
  template:
    metadata:
      labels:
        app: vca-ai
    spec:
      containers:
        - name: vca-ai
          image: 815373273907.dkr.ecr.ap-northeast-2.amazonaws.com/vca-ai:latest
          ports:
            - containerPort: 8000
          env:
            - name: VCA_SHARED_STORAGE_ROOT
              value: "/vca_v2/output/input"
            - name: VCA_ENGINE_ROOT
              value: "/vca_v2"
            - name: VCA_RUN_TIMEOUT_SECONDS
              value: "3600"
            - name: VCA_RUN_MODE
              value: "real"
            - name: VCA_DEVICE
              value: "auto"
            - name: VCA_MAX_IMAGES
              value: "1"
            - name: VCA_SKIP_VISUAL_CUES
              value: "false"
            - name: VCA_LOCAL_ALLOW_UNVERIFIED_MODEL_HASHES
              value: "false"
            - name: VCA_MODEL_CACHE_ROOT
              value: "/opt/vca-models/models"
            - name: VCA_DOCUMENT_CORPUS_DIR
              value: "/opt/vca-data/document"
            # 로컬 docker-compose는 이 값을 true로 켜서 첫 기동 시 모델을
            # 내려받는다. 운영 이미지에 모델을 미리 구워넣을지, 매 기동마다
            # 받을지(그럴 경우 vca-model-cache를 emptyDir이 아니라 영속
            # 볼륨으로 바꿔야 함) 아직 안 정했다 - 일단 false로 두고 미룬다.
            - name: VCA_BOOTSTRAP_MODELS
              value: "false"
            - name: UV_PROJECT_ENVIRONMENT
              value: "/opt/vca-uv-env"
            - name: UV_CACHE_DIR
              value: "/opt/vca-uv-cache"
            - name: UV_FROZEN
              value: "true"
          envFrom:
            - secretRef:
                name: app-secrets
          volumeMounts:
            # docker-compose가 ./shared/vca/{engine-output,input-store,document-corpus}를
            # 각각 따로 bind-mount하는 것과 동일하게, 같은 EFS PVC를
            # subPath로 나눠 마운트해 conservation-backend와 데이터를 공유한다.
            - name: shared-storage
              mountPath: /vca_v2/output
              subPath: vca/engine-output
            - name: shared-storage
              mountPath: /vca_v2/output/input
              subPath: vca/input-store
            - name: shared-storage
              mountPath: /opt/vca-data/document
              subPath: vca/document-corpus
              readOnly: true
            - name: vca-uv-cache
              mountPath: /opt/vca-uv-cache
            - name: vca-model-cache
              mountPath: /opt/vca-models
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            claimName: shared-efs-pvc
        - name: vca-uv-cache
          emptyDir: {}
        - name: vca-model-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vca-ai
spec:
  selector:
    app: vca-ai
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conservation-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: conservation-backend
  template:
    metadata:
      labels:
        app: conservation-backend
    spec:
      containers:
        - name: conservation-backend
          image: 428270342381.dkr.ecr.ap-northeast-2.amazonaws.com/conservation-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: CONSERVATION_GUIDE_AI_BASE_URL
              value: "http://conservation-guide-ai:8000"
            - name: POTTERY_INSPECTION_AI_BASE_URL
              value: "http://pottery-inspection-ai:8000"
            - name: XRAY_AI_BASE_URL
              value: "http://xray-ai:8000"
            - name: XRAY_AI_TIMEOUT_SECONDS
              value: "300"
            - name: XRAY_AI_CONFIG_NAME
              value: "config.batch_fast.color_slot_voronoi_all_fragments_v13_conservative.json"
            - name: XRAY_STORAGE_LOCAL_ROOT
              value: "/shared/jobs"
            - name: XRAY_STORAGE_CONTAINER_ROOT
              value: "/shared/jobs"
            - name: XRAY_STITCH_CALLBACK_URL
              value: "http://conservation-backend:8080/api/xray/stitch/callback"
            - name: VCA_AI_BASE_URL
              value: "http://vca-ai:8000"
            - name: VCA_AI_TIMEOUT_SECONDS
              value: "3900"
            # VCA_ACCESS_TOKEN도 app-secrets에 있어야 한다(아래 envFrom으로
            # 자동 주입됨) - 없으면 Spring이 기동 시점에 바로 실패한다.
            - name: VCA_SHARED_STORAGE_ROOT
              value: "/shared/vca/input-store"
            - name: VCA_SHARED_STORAGE_CONTAINER_ROOT
              value: "/vca_v2/output/input"
            - name: VCA_ENGINE_OUTPUT_ROOT
              value: "/shared/vca/engine-output"
            - name: VCA_DOCUMENT_CORPUS_ROOT
              value: "/shared/vca/document-corpus"
            - name: VCA_S3_OBJECT_PREFIX
              value: "vca/images"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: POSTGRES_PASSWORD
          envFrom:
            - secretRef:
                name: app-secrets
      # shared-storage(EFS) 볼륨 없음 — X-ray 산출물은 S3에 저장되고
      # 이 Pod의 로컬 디스크는 쓰지 않는다.
---
apiVersion: v1
kind: Service
metadata:
  name: conservation-backend
spec:
  selector:
    app: conservation-backend
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: conservation-backend
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: conservation-backend
                port:
                  number: 8080
