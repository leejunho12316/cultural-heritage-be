version: 0.2

env:
  variables:
    AWS_REGION: ap-northeast-2
    ACCOUNT_ID: "428270342381"

phases:
  pre_build:
    commands:
      - echo "===== ECR LOGIN ====="
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - echo "IMAGE_TAG=$IMAGE_TAG"

      - |
        echo "===== GIT DEBUG ====="
        git status
        git log --oneline -5 || true
        git rev-parse HEAD
        git rev-parse --is-shallow-repository || true

        echo "===== ENSURE GIT HISTORY ====="

        if ! git rev-parse HEAD^ >/dev/null 2>&1; then
          echo "Previous commit not available. Fetching history..."

          git fetch --unshallow origin main 2>/dev/null \
            || git fetch --depth=10 origin main
        fi

        echo "===== DETECT CHANGED FILES ====="

        BUILD_BACKEND=false
        BUILD_GUIDE=false
        BUILD_XRAY=false
        BUILD_POTTERY=false
        BUILD_REPORT=false
        APPLY_K8S=false

        if git rev-parse HEAD^ >/dev/null 2>&1; then
          CHANGED_FILES="$(git diff --name-only HEAD^ HEAD)"
        else
          echo "No previous commit available. Running full build."
          CHANGED_FILES="__FULL_BUILD__"
        fi

        echo "$CHANGED_FILES"

        if [ "$CHANGED_FILES" = "__FULL_BUILD__" ]; then
          BUILD_BACKEND=true
          BUILD_GUIDE=true
          BUILD_XRAY=true
          BUILD_POTTERY=true
          BUILD_REPORT=true
          APPLY_K8S=true
        else
          if echo "$CHANGED_FILES" | grep -Eq '^(src/|build\.gradle$|settings\.gradle$|gradle/|gradlew$|gradlew\.bat$|Dockerfile$|\.dockerignore$)'; then
            BUILD_BACKEND=true
          fi

          if echo "$CHANGED_FILES" | grep -Eq '^ai-services/conservation-guide-ai/'; then
            BUILD_GUIDE=true
          fi

          if echo "$CHANGED_FILES" | grep -Eq '^ai-services/xray-ai/'; then
            BUILD_XRAY=true
          fi

          if echo "$CHANGED_FILES" | grep -Eq '^ai-services/pottery-inspection-ai/'; then
            BUILD_POTTERY=true
          fi

          if echo "$CHANGED_FILES" | grep -Eq '^ai-services/report-ai/'; then
            BUILD_REPORT=true
          fi

          if echo "$CHANGED_FILES" | grep -Eq '^k8s/'; then
            APPLY_K8S=true
          fi
        fi

        echo "===== BUILD PLAN ====="
        echo "backend=$BUILD_BACKEND"
        echo "guide=$BUILD_GUIDE"
        echo "xray=$BUILD_XRAY"
        echo "pottery=$BUILD_POTTERY"
        echo "report=$BUILD_REPORT"
        echo "apply_k8s=$APPLY_K8S"

  build:
    commands:
      - |
        set -e
        echo "===== BUILD CHANGED SERVICES ====="

        if [ "$BUILD_BACKEND" = "true" ]; then
          docker build -t conservation-backend:$IMAGE_TAG .
        fi

        if [ "$BUILD_GUIDE" = "true" ]; then
          docker build -t conservation-guide-ai:$IMAGE_TAG ai-services/conservation-guide-ai
        fi

        if [ "$BUILD_XRAY" = "true" ]; then
          docker build -t xray-ai:$IMAGE_TAG ai-services/xray-ai
        fi

        if [ "$BUILD_POTTERY" = "true" ]; then
          docker build -t pottery-inspection-ai:$IMAGE_TAG ai-services/pottery-inspection-ai
        fi

        if [ "$BUILD_REPORT" = "true" ]; then
          docker build -t report-ai:$IMAGE_TAG ai-services/report-ai
        fi

  post_build:
    commands:
      - |
        set -e
        echo "===== PUSH CHANGED SERVICES ====="

        SERVICES=""

        if [ "$BUILD_BACKEND" = "true" ]; then
          SERVICES="$SERVICES conservation-backend"
        fi

        if [ "$BUILD_GUIDE" = "true" ]; then
          SERVICES="$SERVICES conservation-guide-ai"
        fi

        if [ "$BUILD_XRAY" = "true" ]; then
          SERVICES="$SERVICES xray-ai"
        fi

        if [ "$BUILD_POTTERY" = "true" ]; then
          SERVICES="$SERVICES pottery-inspection-ai"
        fi

        if [ "$BUILD_REPORT" = "true" ]; then
          SERVICES="$SERVICES report-ai"
        fi

        for svc in $SERVICES; do
          echo "Pushing $svc"

          docker tag $svc:$IMAGE_TAG \
            $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$svc:$IMAGE_TAG

          docker tag $svc:$IMAGE_TAG \
            $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$svc:latest

          docker push \
            $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$svc:$IMAGE_TAG

          docker push \
            $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$svc:latest
        done

      - |
        echo "===== KUBERNETES SETUP ====="

        curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
        chmod +x kubectl
        mv kubectl /usr/local/bin/

        aws eks update-kubeconfig \
          --name conservation-cluster \
          --region $AWS_REGION

      - |
        if [ "$APPLY_K8S" = "true" ]; then
          echo "Applying k8s/app.yaml"
          kubectl apply -f k8s/app.yaml
        fi

      - |
        echo "===== RESTART CHANGED DEPLOYMENTS ====="

        for svc in $SERVICES; do
          echo "Restarting $svc"
          kubectl rollout restart deployment/$svc
        done

      - |
        echo "===== WAIT FOR ROLLOUT ====="

        for svc in $SERVICES; do
          kubectl rollout status deployment/$svc --timeout=10m
        done

      - |
        echo "===== DEPLOY COMPLETE ====="
